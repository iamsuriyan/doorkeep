# doorkeep edge mode for nginx (auth_request is built in; no module needed).
# Include inside your server { } block and adjust the upstream address.
#
#   upstream doorkeep { server 127.0.0.1:8080; }   # in the http { } block
#
# Add the proxy's address to doorkeep's trusted_proxies so it honours the
# X-Forwarded-* headers below.

# Snippet, challenge page and API on your own origin (no CORS, not blockable
# as a third-party host).
location /_dk/ {
    proxy_pass http://doorkeep/;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
}

# The sub-request nginx makes before serving a protected location.
location = /_dk_auth {
    internal;
    proxy_pass http://doorkeep/v1/auth;
    proxy_pass_request_body off;
    proxy_set_header Content-Length    "";
    proxy_set_header X-Original-URI    $request_uri;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
}

# Browsers without a valid check go to the hosted interstitial and come back
# to the same URL. nginx cannot URL-encode, so $request_uri is passed raw;
# doorkeep reads everything after "rd=" as the return path, "&" included.
location @doorkeep_check {
    return 302 /_dk/challenge?rd=$request_uri;
}

# Then protect any location:
#
#   location /search {
#       auth_request /_dk_auth;
#       error_page 401 = @doorkeep_check;
#       proxy_pass http://app;
#   }
