[project]
name = "doorkeep"
version = "0.1.0"
description = "Verify doorkeep tokens from Python, with Django helpers"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
django = ["django>=4.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doorkeep"]
