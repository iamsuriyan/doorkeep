# Two doorkeep nodes sharing Postgres (state) and Redis (velocity) behind
# Caddy. Generate shared secrets once:
#   echo "DOORKEEP_SECRET=$(head -c32 /dev/urandom | base64)"    >  .env
#   echo "DOORKEEP_TOKEN_KEY=$(head -c32 /dev/urandom | base64)" >> .env
#   echo "POSTGRES_PASSWORD=$(head -c18 /dev/urandom | base64)"  >> .env
# Then: docker compose -f deploy/docker-compose.cluster.yml up -d
x-doorkeep: &doorkeep
  image: ghcr.io/iamsuriyan/doorkeep:latest
  restart: unless-stopped
  depends_on: [postgres, redis]
  environment:
    DOORKEEP_DATABASE_URL: postgres://doorkeep:${POSTGRES_PASSWORD}@postgres:5432/doorkeep?sslmode=disable
    DOORKEEP_REDIS_URL: redis://redis:6379/0
    DOORKEEP_SECRET: ${DOORKEEP_SECRET}
    DOORKEEP_TOKEN_KEY: ${DOORKEEP_TOKEN_KEY}
    DOORKEEP_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8
services:
  doorkeep-1: *doorkeep
  doorkeep-2: *doorkeep
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: doorkeep
      POSTGRES_DB: doorkeep
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
  lb:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    command: ["caddy", "reverse-proxy", "--from", ":8080", "--to", "doorkeep-1:8080", "--to", "doorkeep-2:8080"]
volumes:
  pg:
