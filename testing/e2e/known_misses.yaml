# Signals that do not fire against a given automation setup, tracked in the
# open so detection drift is measured rather than hidden. The e2e suite fails
# only when a listed detection regresses, not because these gaps exist.
#
# Last measured: 2026-10-22, Playwright 1.5x, Chromium 1248 build, Firefox 157.

- signal: CDP_RUNTIME_LEAK
  setup: Playwright headed and headless Chromium
  status: does not fire
  note: >
    The console-serialisation probe for the DevTools Runtime domain no longer
    triggers on current Chromium. Kept in the rule set (weight 25) for older
    builds and self-built drivers; needs a replacement probe.

- signal: per-request detection
  setup: Playwright headed Chromium with --disable-blink-features=AutomationControlled and webdriver removed
  status: detected by behaviour only (fill without keys, exact-centre zero-duration clicks)
  note: >
    A driver that types with jittered delays and moves the pointer along a
    curve defeats these. Detection then rests on velocity and distribution
    (M2) and the challenge path.

- signal: playwright-extra + puppeteer-extra-plugin-stealth, headless, default input
  setup: tests/stealth.spec.ts
  status: blocked (risk 100)
  note: >
    Stealth hides webdriver, HeadlessChrome and the chrome object, but scripted
    input (fill without keys, exact-centre zero-duration clicks), a font set
    that contradicts the claimed OS and an emulated network remain.

- signal: playwright-extra + stealth, headed, synthesised human-like input
  setup: tests/stealth.spec.ts (jittered keystrokes, curved mouse paths, real press durations)
  status: allowed (risk 25 after the evidence guard; 0 before it)
  note: >
    Per-request detection is not realistic against this setup; the design says
    so (threat model, section 9). Only FONT_OS_MISMATCH fires. Since
    2026-10-22, synthesised human evidence no longer cancels a device
    self-contradiction. Remaining defences are volume and distribution
    (fingerprint and canvas velocity across networks, subnet device farms,
    cadence) and per-site thresholds.

# Measured 2026-10-23 with tests/advanced.spec.ts (DK_ADVANCED=1).

- signal: patchright, headed, default input (fill, click)
  setup: tests/advanced.spec.ts
  status: caught (held at the visual challenge, risk 70)
  note: >
    patchright removes the CDP and automation leaks, so detection is
    behavioural: fields filled without key presses and exact-centre clicks
    of about 1 ms. It was allowed (risk 40, proof of work only) until
    PROGRAMMATIC_FILL_AND_CLICK stopped requiring zero key events.

- signal: Nodriver, headed, CDP key and mouse events
  setup: tests/advanced.spec.ts, testing/stealth/nodriver_run.py
  status: caught (visual challenge or refused, 6 of 6 runs)
  note: >
    Same behavioural tells as patchright. Its synthesised pointer path used
    to earn HUMAN_POINTER_EVIDENCE; human-evidence rules no longer apply when
    the clicks themselves are scripted.

- signal: patchright, headed, synthesised human-like input
  setup: tests/advanced.spec.ts (curved paths, jittered keys, real press durations)
  status: allowed (risk 0)
  note: >
    No leaks and no behavioural tells. Same class as the stealth-plugin miss
    above: only volume and distribution signals can catch it.

- signal: Camoufox, humanized
  setup: tests/advanced.spec.ts, testing/stealth/camoufox_run.py (GitHub Actions, advanced workflow)
  status: caught (held at the visual challenge, risk 55)
  note: >
    Humanized cursor and real key presses, and it presents as
    resistFingerprinting Firefox, which relaxes the consistency rules by
    design. Only its clicks give it away: exact centre with a near-zero
    press. It was allowed at risk 40 (proof of work only) until
    SCRIPTED_CLICK (2026-10-23). A driver that clicks off-centre with real
    press durations would get through, like patchright with human-like input.
