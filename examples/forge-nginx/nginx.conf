# Forgejo (or Gitea) behind nginx, with doorkeep edge mode on the pages
# crawlers hammer: repository browsing, history, blame, archives and search.
# git over HTTPS, the API, sign-in, static assets and feeds stay unprotected
# so git clients, CI and feed readers keep working.
events {}
http {
  upstream doorkeep { server doorkeep:8080; }
  upstream forge    { server forgejo:3000; }

  # The same /_dk/, /_dk_auth and @doorkeep_check blocks users copy from
  # integrations/nginx/doorkeep.conf.
  server {
    listen 8000;
    client_max_body_size 512m;
    include /etc/nginx/doorkeep.conf;

    # Expensive to render, endlessly enumerable: what AI crawlers fetch.
    location ~ ^/[^/]+/[^/]+/(src|commits?|blame|compare|archive|raw|graph|activity|search|issues|pulls)(/|$) {
      auth_request /_dk_auth;
      error_page 401 = @doorkeep_check;
      proxy_pass http://forge;
      include /etc/nginx/forge_proxy.conf;
    }
    location ~ ^/explore/ {
      auth_request /_dk_auth;
      error_page 401 = @doorkeep_check;
      proxy_pass http://forge;
      include /etc/nginx/forge_proxy.conf;
    }

    # Everything else (git smart HTTP, /api/, sign-in, assets, RSS) unchanged.
    location / {
      proxy_pass http://forge;
      include /etc/nginx/forge_proxy.conf;
    }
  }
}
