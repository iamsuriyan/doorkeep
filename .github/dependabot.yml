# Weekly dependency updates. Minor and patch updates are grouped into one
# pull request per ecosystem; majors come separately.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly }
    groups:
      go-minor: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm-minor: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: docker
    directory: /deploy
    schedule: { interval: weekly }
