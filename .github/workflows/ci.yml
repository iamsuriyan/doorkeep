name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD":/repo zricethezav/gitleaks:latest git /repo --no-banner --config /repo/.gitleaks.toml
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - name: generated docs are current
        run: go run ./tools/docgen -out docs/reference && git diff --exit-code docs/reference/features.md docs/reference/reason-codes.md
      - run: go test -race -count=1 ./...
      - name: store tests on Postgres, velocity on Redis
        run: |
          docker run -d --name pg -p 15432:5432 -e POSTGRES_PASSWORD=dk -e POSTGRES_USER=dk -e POSTGRES_DB=dk postgres:17-alpine
          docker run -d --name redis -p 16379:6379 redis:7-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U dk && break; sleep 1; done
          DK_TEST_POSTGRES="postgres://dk:dk@127.0.0.1:15432/dk?sslmode=disable" DK_TEST_REDIS=redis://127.0.0.1:16379/0 \
            go test -count=1 ./internal/store/... ./internal/signals/velocity/
      - name: Prometheus alert rules
        run: docker run --rm -v "$PWD/deploy/prometheus:/w" -w /w --entrypoint promtool prom/prometheus:latest test rules alerts_test.yml
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @doorkeep/snippet --filter @doorkeep/dashboard --filter @doorkeep/verify --filter @doorkeep/next build
      - run: pnpm --filter @doorkeep/snippet --filter @doorkeep/dashboard --filter @doorkeep/verify --filter @doorkeep/next test
      - name: snippet size budget (14 KB gzip)
        run: |
          SIZE=$(gzip -c web/snippet/dist/dk.js | wc -c)
          echo "dk.js gzip: $SIZE bytes"
          test "$SIZE" -le 14336
      - name: embedded assets match the sources
        run: git diff --exit-code internal/api/assets
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.4"]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
      - name: lint
        run: find integrations/php integrations/wordpress integrations/laravel -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php integrations/php/tests/run.php
      - run: php -d error_reporting=E_ALL integrations/wordpress/tests/run.php
      - run: php integrations/laravel/tests/run.php
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: client and Django helpers
        working-directory: integrations/python
        run: uv run --python ${{ matrix.python }} --with 'django>=4.2,<6' --with-editable . python -m unittest discover -s tests -v
