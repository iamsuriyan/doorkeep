name: e2e
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # One fixed location for install and test: the test step overrides HOME,
      # which otherwise moves Playwright's default browser cache.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @doorkeep/snippet build && pnpm --filter @doorkeep/dashboard build
      # The Next.js example depends on the workspace packages' build output.
      - run: pnpm --filter @doorkeep/verify build && pnpm --filter @doorkeep/next build
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      # System libraries come from the Ubuntu mirror, which is sometimes very
      # slow; bound each attempt and retry rather than hang the whole job.
      - name: browser system dependencies
        run: |
          for i in 1 2 3; do
            timeout 600 pnpm --filter e2e exec playwright install-deps chromium firefox && break
            echo "attempt $i failed or timed out; retrying"
            [ "$i" = 3 ] && exit 1
          done
      - run: pnpm --filter e2e exec playwright install chromium firefox
      - name: detection matrix
        run: xvfb-run -a -s "-screen 0 1920x1080x24" pnpm --filter e2e test
        env:
          HOME: ${{ github.workspace }}/.home
